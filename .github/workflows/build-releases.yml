name: Build Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app (use committed routes.min.json)
        shell: bash
        run: |
          # Vite inlines these at build time; without them every API request fails with 401
          test -n "$VITE_DIGITRANSIT_API_KEY" || { echo "::error::VITE_DIGITRANSIT_API_KEY secret is missing"; exit 1; }
          npm run build:skip-routes
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Create web artifact
        run: |
          cd dist
          zip -r ../tartubus-web.zip .
          cd ..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: tartubus-web
          path: tartubus-web.zip

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app (use committed routes.min.json)
        shell: bash
        run: |
          # Vite inlines these at build time; without them every API request fails with 401
          test -n "$VITE_DIGITRANSIT_API_KEY" || { echo "::error::VITE_DIGITRANSIT_API_KEY secret is missing"; exit 1; }
          npm run build:skip-routes
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Sync to Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tartubus-android-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app (use committed routes.min.json)
        shell: bash
        run: |
          # Vite inlines these at build time; without them every API request fails with 401
          test -n "$VITE_DIGITRANSIT_API_KEY" || { echo "::error::VITE_DIGITRANSIT_API_KEY secret is missing"; exit 1; }
          npm run build:skip-routes
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Package win32 app
        shell: bash
        run: |
          # Package from a staging copy of electron/ (its own package.json with
          # "main"), not from the repo root (no "main", and "type": "module")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          rm -rf electron-app release
          cp -r electron electron-app
          cp -r dist electron-app/dist
          cd electron-app
          npm pkg set version="$VERSION"
          npm install --no-audit --no-fund
          npx electron-packager . Tartubus --platform=win32 --arch=x64 --out=../release --overwrite

      - name: Create Windows ZIP
        run: Compress-Archive -Path release/Tartubus-win32-x64 -DestinationPath tartubus-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tartubus-windows
          path: tartubus-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app (use committed routes.min.json)
        shell: bash
        run: |
          # Vite inlines these at build time; without them every API request fails with 401
          test -n "$VITE_DIGITRANSIT_API_KEY" || { echo "::error::VITE_DIGITRANSIT_API_KEY secret is missing"; exit 1; }
          npm run build:skip-routes
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Package linux app
        shell: bash
        run: |
          # Package from a staging copy of electron/ (its own package.json with
          # "main"), not from the repo root (no "main", and "type": "module")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          rm -rf electron-app release
          cp -r electron electron-app
          cp -r dist electron-app/dist
          cd electron-app
          npm pkg set version="$VERSION"
          npm install --no-audit --no-fund
          npx electron-packager . Tartubus --platform=linux --arch=x64 --out=../release --overwrite

      - name: Create Linux tarball
        run: |
          cd release
          tar -czf ../tartubus-linux.tar.gz Tartubus-linux-x64
          cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tartubus-linux
          path: tartubus-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app (use committed routes.min.json)
        shell: bash
        run: |
          # Vite inlines these at build time; without them every API request fails with 401
          test -n "$VITE_DIGITRANSIT_API_KEY" || { echo "::error::VITE_DIGITRANSIT_API_KEY secret is missing"; exit 1; }
          npm run build:skip-routes
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Package darwin app
        shell: bash
        run: |
          # Package from a staging copy of electron/ (its own package.json with
          # "main"), not from the repo root (no "main", and "type": "module")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          rm -rf electron-app release
          cp -r electron electron-app
          cp -r dist electron-app/dist
          cd electron-app
          npm pkg set version="$VERSION"
          npm install --no-audit --no-fund
          npx electron-packager . Tartubus --platform=darwin --arch=x64 --out=../release --overwrite

      - name: Create macOS ZIP
        run: |
          cd release
          zip -r ../tartubus-macos.zip Tartubus-darwin-x64
          cd ..

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tartubus-macos
          path: tartubus-macos.zip

  create-release:
    needs: [build-web, build-android-apk, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Publish whatever built: one broken platform shouldn't block the release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tartubus-web/tartubus-web.zip
            tartubus-android-apk/app-release-unsigned.apk
            tartubus-windows/tartubus-windows.zip
            tartubus-linux/tartubus-linux.tar.gz
            tartubus-macos/tartubus-macos.zip
          body: |
            ## Tartubus Release

            ### Downloads
            - **Web App**: Extract `tartubus-web.zip` and serve with any web server
            - **Android APK**: Install `app-release-unsigned.apk` (unsigned, for testing)
            - **Windows**: Extract `tartubus-windows.zip` and run `Tartubus.exe`
            - **Linux**: Extract `tartubus-linux.tar.gz` and run `Tartubus`
            - **macOS**: Extract `tartubus-macos.zip` and run `Tartubus.app`

            ### What's New
            See [CHANGELOG.md](https://github.com/Ekats/Tartubus/blob/master/CHANGELOG.md) for details.

            ### Online Version
            Try it online: https://ekats.github.io/Tartubus/
          fail_on_unmatched_files: false
          draft: true
          prerelease: false
